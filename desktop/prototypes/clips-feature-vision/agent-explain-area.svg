<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1800" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5F1EA"/>
      <stop offset=".52" stop-color="#E8E1D5"/>
      <stop offset="1" stop-color="#DCD4C6"/>
    </linearGradient>
    <linearGradient id="screen" x1="248" y1="250" x2="1204" y2="842" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#28332F"/>
      <stop offset=".44" stop-color="#3A3B31"/>
      <stop offset="1" stop-color="#6F4B39"/>
    </linearGradient>
    <linearGradient id="redline" x1="330" y1="292" x2="1010" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F05B43"/>
      <stop offset=".58" stop-color="#D59839"/>
      <stop offset="1" stop-color="#2E7F79"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#2A241B" flood-opacity=".18"/>
    </filter>
    <filter id="tight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#2A241B" flood-opacity=".18"/>
    </filter>
    <style>
      .title { font: 700 72px Georgia, serif; fill: #171612; letter-spacing: 0; }
      .sub { font: 400 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #625A4D; }
      .kicker { font: 800 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9A3B2D; letter-spacing: 1.8px; text-transform: uppercase; }
      .h2 { font: 700 30px Georgia, serif; fill: #171612; }
      .h3 { font: 750 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1D1A15; }
      .body { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5C5448; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6A6256; }
      .tiny { font: 700 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7A7063; letter-spacing: .7px; text-transform: uppercase; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #554E44; }
      .panel { fill: #FBF8F1; stroke: #D1C5B4; stroke-width: 1.2; filter: url(#shadow); }
      .surface { fill: #FFFDF8; stroke: #D8CCBA; stroke-width: 1.1; }
      .chip { fill: #F0E7D9; stroke: #D3C4B1; stroke-width: 1; }
      .line { stroke: #BDAF9A; stroke-width: 1.2; }
      .darkText { fill: #171612; }
      .mutedStroke { stroke: #D5C8B6; stroke-width: 1.1; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <path d="M136 922 C338 776 477 798 646 875 C864 975 1034 948 1182 802 C1326 661 1428 584 1665 610" stroke="#C8BAA5" stroke-width="2" stroke-dasharray="7 12" opacity=".7"/>
  <path d="M1127 116 C1005 226 1010 338 1124 438 C1236 536 1233 635 1090 750" stroke="#A65A44" stroke-width="2" stroke-dasharray="5 14" opacity=".35"/>

  <text x="94" y="112" class="kicker">Updated direction / CLIPS</text>
  <text x="94" y="196" class="title">Record the clip. Give the agent the evidence.</text>
  <text x="98" y="244" class="sub">Screen video + mic narration + live drawing/annotations + transcript, exposed to agents through MCP.</text>

  <g transform="translate(96 310)">
    <rect width="1038" height="650" rx="28" class="panel"/>
    <text x="34" y="56" class="kicker">In-app area</text>
    <text x="34" y="100" class="h2">CLIPS</text>
    <text x="34" y="132" class="body">Separate from normal Sessions. This is for intentional visual handoffs.</text>

    <rect x="34" y="172" width="970" height="420" rx="24" fill="url(#screen)" filter="url(#tight)"/>
    <rect x="66" y="206" width="220" height="330" rx="18" fill="#F6EFE2" opacity=".95"/>
    <rect x="88" y="230" width="112" height="18" rx="9" fill="#252119"/>
    <rect x="88" y="274" width="154" height="12" rx="6" fill="#CBBDA8"/>
    <rect x="88" y="302" width="176" height="12" rx="6" fill="#CBBDA8"/>
    <rect x="88" y="330" width="126" height="12" rx="6" fill="#CBBDA8"/>
    <rect x="88" y="384" width="160" height="62" rx="14" fill="#E45A42"/>
    <rect x="88" y="462" width="116" height="14" rx="7" fill="#CBBDA8"/>

    <rect x="340" y="224" width="436" height="246" rx="18" fill="#F7F3EA" opacity=".9"/>
    <rect x="374" y="258" width="226" height="20" rx="10" fill="#242018"/>
    <rect x="374" y="308" width="336" height="14" rx="7" fill="#BFB09A"/>
    <rect x="374" y="338" width="282" height="14" rx="7" fill="#BFB09A"/>
    <rect x="374" y="368" width="316" height="14" rx="7" fill="#BFB09A"/>

    <path d="M317 513 C440 420 555 516 657 421 C731 352 806 346 891 394" stroke="url(#redline)" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="654" cy="421" r="22" fill="#F05B43" stroke="#FFF7EC" stroke-width="6"/>
    <path d="M660 302 L794 238" stroke="#F05B43" stroke-width="5" stroke-linecap="round"/>
    <path d="M783 235 L816 228 L797 257 Z" fill="#F05B43"/>
    <rect x="804" y="238" width="152" height="48" rx="24" fill="#FFF7EC"/>
    <text x="827" y="268" class="h3">Look here</text>

    <g transform="translate(232 604)">
      <rect width="622" height="70" rx="35" fill="#211D17"/>
      <circle cx="44" cy="35" r="17" fill="#F05B43"/>
      <rect x="84" y="22" width="1.5" height="26" fill="#6B6257"/>
      <text x="112" y="41" fill="#FDF8EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="750">Screen + Mic</text>
      <rect x="234" y="22" width="1.5" height="26" fill="#6B6257"/>
      <text x="262" y="41" fill="#FDF8EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="750">Pen</text>
      <rect x="326" y="22" width="1.5" height="26" fill="#6B6257"/>
      <text x="354" y="41" fill="#FDF8EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="750">Arrow</text>
      <rect x="458" y="22" width="1.5" height="26" fill="#6B6257"/>
      <text x="486" y="41" fill="#FDF8EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="750">Stop &amp; Process</text>
    </g>

    <text x="34" y="622" class="tiny">What gets captured</text>
    <text x="34" y="652" class="body">Video track, microphone narration, live annotation strokes, timestamped transcript, key frames, app/window context.</text>
  </g>

  <g transform="translate(1182 310)">
    <rect width="522" height="650" rx="28" class="panel"/>
    <text x="34" y="56" class="kicker">Agent packet</text>
    <text x="34" y="100" class="h2">MCP sees the whole clip</text>
    <text x="34" y="132" class="body">The agent does not need a vague prompt. It receives a structured</text>
    <text x="34" y="156" class="body">bundle with playable media and machine-readable context.</text>

    <g transform="translate(34 200)">
      <rect width="454" height="88" rx="20" class="surface"/>
      <rect x="24" y="25" width="44" height="38" rx="9" fill="#242018"/>
      <path d="M41 35 L57 44 L41 53 Z" fill="#F7F1E7"/>
      <text x="90" y="38" class="h3">clip-video.mp4</text>
      <text x="90" y="64" class="small">Screen recording with cursor and live drawing overlay</text>
    </g>

    <g transform="translate(34 306)">
      <rect width="454" height="88" rx="20" class="surface"/>
      <rect x="24" y="25" width="44" height="38" rx="9" fill="#E65B43"/>
      <text x="38" y="50" fill="#FFF7EC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800">T</text>
      <text x="90" y="38" class="h3">transcript.json</text>
      <text x="90" y="64" class="small">Words, timestamps, speakers, annotation references</text>
    </g>

    <g transform="translate(34 412)">
      <rect width="454" height="88" rx="20" class="surface"/>
      <rect x="24" y="25" width="44" height="38" rx="9" fill="#2E7F79"/>
      <path d="M36 51 C45 38 54 60 64 42" stroke="#FFF7EC" stroke-width="4" stroke-linecap="round" fill="none"/>
      <text x="90" y="38" class="h3">marks.ndjson</text>
      <text x="90" y="64" class="small">Pen strokes, arrows, labels, bounding boxes, times</text>
    </g>

    <g transform="translate(34 518)">
      <rect width="454" height="88" rx="20" class="surface"/>
      <rect x="24" y="25" width="44" height="38" rx="9" fill="#B99039"/>
      <text x="37" y="50" fill="#FFF7EC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800">{}</text>
      <text x="90" y="38" class="h3">session-manifest.json</text>
      <text x="90" y="64" class="small">Title, intent, files, source app, permissions, status</text>
    </g>

    <rect x="34" y="626" width="454" height="2" fill="#D2C5B3"/>
  </g>

  <g transform="translate(1182 988)">
    <rect width="522" height="58" rx="29" fill="#211D17"/>
    <text x="28" y="37" fill="#FFF8EF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">mcp.get_clip(id) -> video + transcript + marks + notes</text>
  </g>

  <g transform="translate(96 990)">
    <text x="0" y="0" class="tiny">Product decision</text>
    <text x="0" y="30" class="body">Keep normal Sessions for passive capture. Add CLIPS for intentional visual agent handoffs.</text>
    <text x="0" y="58" class="body">The core promise: “I show it once, talk over it, draw live, add notes after, and every agent can inspect it later.”</text>
  </g>
</svg>
