<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cepessa CLIPS Feature Vision</title>
    <style>
      :root {
        color-scheme: light;
        background: #ece6da;
        color: #171612;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      main {
        width: min(100%, 1800px);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #cfc2ad;
        box-shadow: 0 30px 70px rgba(36, 32, 24, 0.18);
      }

      img + img {
        margin-top: 34px;
      }

      p {
        margin: 18px 0 0;
        color: #625a4d;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./agent-explain-area.svg" alt="Cepessa CLIPS area for screen video, narration, live annotations, transcript, and MCP access" />
      <img src="./cepessa-clips-vision.svg" alt="Cepessa Clips feature vision board" />
      <p>Prototype only. The top board is the corrected direction: CLIPS for agent-readable visual handoffs with live drawing during recording and optional notes after. The lower board is the earlier share-oriented concept.</p>
    </main>
  </body>
</html>
