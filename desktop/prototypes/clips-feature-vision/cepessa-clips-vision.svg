<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" fill="none">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1800" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F0E7"/>
      <stop offset="0.48" stop-color="#ECE6DA"/>
      <stop offset="1" stop-color="#DAD5CC"/>
    </linearGradient>
    <linearGradient id="ink" x1="222" y1="124" x2="1578" y2="920" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171612"/>
      <stop offset="1" stop-color="#383326"/>
    </linearGradient>
    <linearGradient id="signal" x1="380" y1="0" x2="1400" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F15D43"/>
      <stop offset="0.46" stop-color="#C3A14A"/>
      <stop offset="1" stop-color="#347F7B"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#242018" flood-opacity="0.18"/>
    </filter>
    <filter id="tightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#242018" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 76px Georgia, serif; letter-spacing: 0; fill: #171612; }
      .sub { font: 400 25px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5E584D; }
      .kicker { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.8px; text-transform: uppercase; fill: #8A3A2C; }
      .h2 { font: 700 31px Georgia, serif; fill: #1D1A15; }
      .h3 { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1D1A15; }
      .body { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5C554A; }
      .small { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6B6256; }
      .tiny { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7C7264; letter-spacing: .4px; }
      .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #5D574C; }
      .panel { fill: #FBF7EF; stroke: #D4C9B9; stroke-width: 1.4; filter: url(#softShadow); }
      .surface { fill: #FFFDF8; stroke: #DDD3C4; stroke-width: 1; }
      .dark { fill: url(#ink); }
      .line { stroke: #BDAF9A; stroke-width: 1.3; }
      .accent { fill: #E95B42; }
      .teal { fill: #347F7B; }
      .gold { fill: #B99039; }
      .chip { fill: #F2E9DB; stroke: #D6C8B5; stroke-width: 1; }
      .clip { fill: #242018; stroke: #F15D43; stroke-width: 2.4; }
      .clip2 { fill: #ECE4D5; stroke: #347F7B; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#paper)"/>
  <path d="M1440 0 C1340 158 1254 234 1084 300 C856 389 750 453 670 631 C590 810 438 903 230 928" stroke="#C8BCA9" stroke-width="2" stroke-dasharray="8 13" opacity=".55"/>
  <path d="M1598 181 C1460 254 1346 267 1194 242 C1053 219 962 244 886 345" stroke="#B65B45" stroke-width="2" stroke-dasharray="5 14" opacity=".36"/>

  <text x="96" y="120" class="kicker">Prototype board / Cepessa Clips</text>
  <text x="94" y="205" class="title">Moments, not recordings.</text>
  <text x="98" y="252" class="sub">A clip feature should feel like extracting evidence from memory, not trimming video in a Loom clone.</text>

  <g transform="translate(96 326)">
    <rect class="panel" width="512" height="660" rx="26"/>
    <text x="34" y="58" class="kicker">01 / source session</text>
    <text x="34" y="104" class="h2">Transcript as a filmstrip</text>
    <text x="34" y="139" class="body">The user starts inside a real Session. Transcript, screen frames,</text>
    <text x="34" y="164" class="body">audio energy, and AI-labeled beats collapse into one timeline.</text>

    <rect x="34" y="202" width="444" height="292" rx="20" class="dark"/>
    <rect x="58" y="226" width="396" height="142" rx="14" fill="#514837"/>
    <rect x="78" y="245" width="102" height="78" rx="10" fill="#C9B78F"/>
    <rect x="194" y="245" width="102" height="78" rx="10" fill="#766E61"/>
    <rect x="310" y="245" width="102" height="78" rx="10" fill="#B75B44"/>
    <text x="78" y="395" fill="#FBF7EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Client hesitates at pricing</text>
    <text x="78" y="424" fill="#D9D0C1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">12:14 - 13:42 / 3 speakers / screen + audio</text>
    <rect x="78" y="448" width="278" height="12" rx="6" fill="#6B6256"/>
    <rect x="78" y="448" width="142" height="12" rx="6" fill="#F15D43"/>

    <g transform="translate(34 534)">
      <rect width="444" height="78" rx="18" class="surface"/>
      <rect x="20" y="22" width="12" height="34" rx="6" class="accent"/>
      <text x="50" y="32" class="tiny">AI MARKED MOMENT</text>
      <text x="50" y="58" class="h3">Objection, decision point, follow-up risk</text>
    </g>
  </g>

  <g transform="translate(644 326)">
    <rect class="panel" width="512" height="660" rx="26"/>
    <text x="34" y="58" class="kicker">02 / clip composer</text>
    <text x="34" y="104" class="h2">The cut is conversational</text>
    <text x="34" y="139" class="body">Instead of opening an editor first, the user asks for intent:</text>
    <text x="34" y="164" class="body">“make a concise client recap” or “extract the strongest proof.”</text>

    <rect x="34" y="202" width="444" height="318" rx="20" class="surface"/>
    <text x="62" y="247" class="h3">Create a clip from this moment</text>
    <rect x="62" y="276" width="382" height="52" rx="26" fill="#F2E9DB" stroke="#D3C5B2"/>
    <circle cx="91" cy="302" r="12" class="accent"/>
    <text x="114" y="308" class="body">90 sec client recap</text>
    <rect x="62" y="344" width="382" height="52" rx="26" fill="#FFFDF8" stroke="#D3C5B2"/>
    <circle cx="91" cy="370" r="12" fill="#D7CCBA"/>
    <text x="114" y="376" class="body">Sales objection proof</text>
    <rect x="62" y="412" width="382" height="52" rx="26" fill="#FFFDF8" stroke="#D3C5B2"/>
    <circle cx="91" cy="438" r="12" fill="#D7CCBA"/>
    <text x="114" y="444" class="body">Internal handoff</text>
    <path d="M84 491 H422" class="line"/>
    <rect x="84" y="483" width="116" height="16" rx="8" class="clip"/>
    <rect x="207" y="483" width="74" height="16" rx="8" fill="#E3D5C1"/>
    <rect x="286" y="483" width="96" height="16" rx="8" fill="#E3D5C1"/>

    <g transform="translate(34 556)">
      <rect width="444" height="72" rx="18" fill="#242018"/>
      <text x="24" y="31" fill="#FBF7EF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">Agent action contract</text>
      <text x="24" y="55" fill="#CFC6B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">create_clip -> caption_clip -> share_clip</text>
    </g>
  </g>

  <g transform="translate(1192 326)">
    <rect class="panel" width="512" height="660" rx="26"/>
    <text x="34" y="58" class="kicker">03 / share surface</text>
    <text x="34" y="104" class="h2">A living evidence card</text>
    <text x="34" y="139" class="body">The output is not just an MP4. It is a compact artifact with</text>
    <text x="34" y="164" class="body">video, transcript, AI notes, comments, and original-session trace.</text>

    <rect x="34" y="202" width="444" height="352" rx="22" fill="#FFFDF8" stroke="#D4C9B9" filter="url(#tightShadow)"/>
    <rect x="58" y="226" width="396" height="178" rx="16" fill="url(#signal)"/>
    <path d="M58 368 C145 322 231 450 454 300 V404 H58 Z" fill="#1D1A15" opacity=".45"/>
    <circle cx="256" cy="315" r="34" fill="#FBF7EF"/>
    <path d="M247 298 L277 315 L247 332 Z" fill="#1D1A15"/>
    <text x="58" y="440" class="h3">Pricing hesitation: what changed the room</text>
    <text x="58" y="470" class="small">1:28 clip / captions / original session linked</text>
    <rect x="58" y="500" width="118" height="34" rx="17" class="chip"/>
    <text x="82" y="522" class="tiny">SHARE LINK</text>
    <rect x="188" y="500" width="102" height="34" rx="17" class="chip"/>
    <text x="213" y="522" class="tiny">EMBED</text>
    <rect x="302" y="500" width="116" height="34" rx="17" class="chip"/>
    <text x="326" y="522" class="tiny">EXPORT</text>

    <g transform="translate(34 586)">
      <text x="0" y="0" class="tiny">FEATURE IS RIGHT IF</text>
      <circle cx="10" cy="34" r="6" class="teal"/>
      <text x="28" y="40" class="body">A clip can be created from any Session moment</text>
      <circle cx="10" cy="70" r="6" class="teal"/>
      <text x="28" y="76" class="body">Agent, UI, MCP, and API call the same action</text>
      <circle cx="10" cy="106" r="6" class="teal"/>
      <text x="28" y="112" class="body">The share artifact preserves source context</text>
    </g>
  </g>

  <g transform="translate(96 1018)">
    <rect width="1608" height="2" fill="#C9BCA8"/>
    <text x="0" y="50" class="small">Implementation spine: LocalSession/Conversation -> Clip model -> Agent actions -> native composer -> share page/player -> developer/MCP surface.</text>
    <text x="1230" y="50" class="mono">throwaway prototype</text>
  </g>
</svg>
