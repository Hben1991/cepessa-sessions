[project]
name = "cepessa-sessions-mcp"
dynamic = ["version"]
description = "Read-only MCP server for Cepessa Sessions transcripts"
readme = "README.md"
requires-python = ">=3.11.6"
license = "MIT"
authors = [{ name = "Ben" }]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.1.7",
    "mcp>=1.10.0",
    "pydantic>=2.0.0",
]

[project.scripts]
cepessa-sessions-mcp = "cepessa_sessions_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.389", "ruff>=0.7.3", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.hatch.version]
path = "src/cepessa_sessions_mcp/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cepessa_sessions_mcp"]
